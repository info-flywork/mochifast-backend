# MochiFast API — Nginx ters vekil (reverse proxy).
# Sunucuda:
#   cp deploy/nginx/mochifast-api.conf /etc/nginx/conf.d/mochifast-api.fly-work.com.conf
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d mochifast-api.fly-work.com -m info@fly-work.com --agree-tos --no-eff-email
# certbot 443 bloğunu ve 80 → 443 yönlendirmesini bu dosyaya kendisi ekler.
# Alan adı ya da port değişirse: server_name ve proxy_pass satırları + .env'deki PORT/PUBLIC_BASE_URL.

upstream mochifast_api {
    server 127.0.0.1:3070;
    keepalive 32;
}

server {
    listen 80;
    server_name mochifast-api.fly-work.com;

    # API yalnızca JSON alır (uygulama limiti 64 KB). Fotoğraflar doğrudan Bunny'ye yüklenir.
    client_max_body_size 2M;

    # Nginx sürümünü gizle.
    server_tokens off;

    location / {
        proxy_pass http://mochifast_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # İstemcinin gönderdiği X-Forwarded-For'u ezer: uygulama (TRUST_PROXY=1) gerçek IP'yi
        # buradan alır, sahte başlıkla rate limit atlatılamaz.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
