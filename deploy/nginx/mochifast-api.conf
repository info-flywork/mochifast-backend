# MochiFast API — Nginx ters vekil (reverse proxy).
# Sunucuda:
#   cp deploy/nginx/mochifast-api.conf /etc/nginx/conf.d/mochifast.fly-work.com.conf
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d mochifast.fly-work.com -m info@fly-work.com --agree-tos --no-eff-email
# certbot 443 bloğunu ve 80 → 443 yönlendirmesini bu dosyaya kendisi ekler.
# Alan adı ya da port değişirse: server_name ve proxy_pass satırları + .env'deki PORT/PUBLIC_BASE_URL.

upstream mochifast_api {
    server 127.0.0.1:3066;
    keepalive 32;
}

server {
    listen 80;
    server_name mochifast.fly-work.com;

    # JSON uçları (uygulama limiti 64 KB). Fotoğraf yükleme uçları aşağıda ayrıca açılır.
    client_max_body_size 2M;

    # Nginx sürümünü gizle.
    server_tokens off;

    # HSTS (06 §5): uygulama eklemez (helmet hsts: false), burada. certbot bu bloğa 443'ü ekler;
    # tarayıcılar başlığı yalnızca HTTPS yanıtında dikkate alır.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Fotoğraf yükleme (multipart, ≤ 10 MB; uygulama 413'ü kendisi döner). docs/backend/08.
    location ~ ^/v1/(media|meals/photo-analyses|user/me/avatar)$ {
        client_max_body_size 11M;
        proxy_request_buffering on;
        proxy_pass http://mochifast_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Sohbet akışı (SSE): tamponlama kapalı, uzun okuma süresi (15 sn'de bir ping gelir). docs/backend/09 §2.
    location ~ ^/v1/chat/conversations/[^/]+/messages$ {
        proxy_buffering off;
        proxy_cache off;
        proxy_pass http://mochifast_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://mochifast_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # İstemcinin gönderdiği X-Forwarded-For'u ezer: uygulama (TRUST_PROXY=1) gerçek IP'yi
        # buradan alır, sahte başlıkla rate limit atlatılamaz.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
