name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint · Format · Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest"
          --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      CI: 'true'
      TEST_MYSQL_URL: mysql://root:test@127.0.0.1:3306/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - name: OpenAPI üret
        run: npm run openapi
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: openapi.json

  security:
    name: Güvenlik taramaları
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: npm audit (yüksek ve üstü, yalnızca üretim bağımlılıkları)
        run: npm audit --omit=dev --audit-level=high
      - name: Gizli bilgi taraması (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Staging deploy: barındırma sağlayıcısı seçilince eklenecek (docs/backend/14-acik-kararlar.md #19).
  # Şimdilik deploy elle: `npm run deploy` (docs/deploy.md).
